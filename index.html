<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c3340"><title>Livraria Jashin</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="header"><div class="brand"><img src="icon.png" alt="Jashin"><div><h1>Livraria Jashin</h1><p>Histórias para a sua jornada</p></div></div><div class="header-actions"><button id="installBtn" class="text-btn" hidden>Instalar app</button><button id="logoutBtn" class="text-btn" hidden>Sair</button></div></header>
<main class="container"><section id="authView" class="auth-card"><p class="eyebrow">BEM-VINDO À JASHIN</p><h2>Sua próxima aventura começa aqui.</h2><div class="auth-grid"><form id="loginForm"><h3>Entrar</h3><input id="loginEmail" type="email" placeholder="E-mail" required><input id="loginPassword" type="password" placeholder="Senha" required><button class="btn btn-primary">Entrar</button><small>Admin: admin@jashin.local / admin123</small></form><form id="registerForm"><h3>Criar conta</h3><input id="registerName" placeholder="Seu nome" required><input id="registerEmail" type="email" placeholder="E-mail" required><input id="registerPassword" type="password" minlength="6" placeholder="Senha (mín. 6 caracteres)" required><button class="btn btn-secondary">Criar conta</button></form></div></section>
<section id="appView" hidden><nav id="nav"></nav><div id="page"></div></section></main><div id="toast" class="toast" hidden></div><script src="app.js"></script></body></html>
